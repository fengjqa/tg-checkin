name: TG Checkin

on:
  schedule:
    # 每天 UTC 00:17 执行（即北京时间 08:17）
    # 避开整点高负载时段，GitHub Actions 在每小时的开始时负载最高
    # GitHub Actions 的 cron 用 UTC 时间，且可能延迟几分钟，属正常现象
    # 如需调整时间，修改下面这行。例如北京时间 09:00 = UTC 01:00
    - cron: '17 */8 * * *'
    # 每周一 UTC 02:17 执行周报（北京时间 10:17）
    - cron: '17 2 * * 1'
    # 每月 1 号 UTC 02:30 执行月报（北京时间 10:30）
    - cron: '30 2 1 * *'
  # 支持手动触发，可选择任务类型
  workflow_dispatch:
    inputs:
      report_type:
        description: '任务类型（daily/weekly/monthly）'
        required: false
        default: 'daily'
        type: choice
        options:
          - daily
          - weekly
          - monthly
    

jobs:
  # 判断本次触发的任务类型：daily / weekly / monthly
  # 通过 cron 表达式匹配来判断（workflow_dispatch 默认为 daily）
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 导出任务类型供后续 step 使用
    outputs:
      report-type: ${{ steps.set-report-type.outputs.report-type }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine report type
        id: set-report-type
        run: |
          # GitHub Actions 没有直接提供哪个 cron 触发了 workflow
          # 通过当前时间判断：周一触发周报，每月1号触发月报
          DOW=$(date -u +%w)    # 0=Sunday
          DOM=$(date -u +%-d)   # day of month without leading zero
          EVENT="${{ github.event_name }}"

          REPORT_TYPE="daily"
          # 手动触发时使用输入参数指定的类型
          if [ "$EVENT" = "workflow_dispatch" ]; then
            REPORT_TYPE="${{ inputs.report_type }}"
          elif [ "$EVENT" = "schedule" ]; then
            if [ "$DOM" = "1" ]; then
              REPORT_TYPE="monthly"
            elif [ "$DOW" = "1" ]; then
              REPORT_TYPE="weekly"
            fi
          fi
          echo "report-type=$REPORT_TYPE" >> $GITHUB_OUTPUT
          echo "本次任务类型: $REPORT_TYPE"

      # 恢复签到历史记录（用于周报/月报）
      # GitHub Actions 每次运行在新虚拟机上，需用 cache 持久化 history 文件
      #
      # 关键：key 必须用唯一值（run_id），否则精确命中后 Post 阶段不会保存新数据
      # restore-keys 前缀匹配恢复最新缓存，Post 阶段自动保存到 run_id key
      #
      # 重要：周报/月报的 cache key 用不同前缀（readonly-），避免被 daily 的
      # restore-keys 匹配到（否则周报保存的旧数据会覆盖 daily 的最新数据）
      - name: Restore checkin history
        id: restore-history
        if: steps.set-report-type.outputs.report-type == 'daily'
        uses: actions/cache@v4
        with:
          path: checkin_history.json
          key: checkin-history-${{ github.run_id }}
          restore-keys: |
            checkin-history-

      - name: Restore checkin history (read-only)
        if: steps.set-report-type.outputs.report-type != 'daily'
        uses: actions/cache@v4
        with:
          path: checkin_history.json
          key: readonly-history-${{ github.run_id }}-never
          restore-keys: |
            checkin-history-

      # 随机睡眠 3-15 分钟，避免每天执行时间完全一致（仅签到任务延迟）
      - name: Random delay
        if: steps.set-report-type.outputs.report-type == 'daily' && github.event_name == 'schedule'
        run: |
          SLEEP=$((RANDOM % 721 + 180))
          echo "随机等待 $SLEEP 秒（约 $((SLEEP / 60)) 分钟）"
          sleep $SLEEP

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 如果在仓库 Secret 中配置了 CONFIG_YAML，则用它覆盖 config.yaml
      # 这样可以把机器人列表也作为保密内容，不提交到仓库
      - name: Write config from secret (optional)
        env:
          CONFIG_YAML: ${{ secrets.CONFIG_YAML }}
        run: |
          if [ -n "$CONFIG_YAML" ]; then
            printf '%s\n' "$CONFIG_YAML" > config.yaml
            echo "已从 Secret 写入 config.yaml"
          else
            echo "未配置 CONFIG_YAML，使用仓库中的 config.yaml"
          fi

      # ====== 每日签到任务 ======
      - name: Run checkin
        if: steps.set-report-type.outputs.report-type == 'daily'
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          NOTIFY_CHAT_ID: ${{ secrets.NOTIFY_CHAT_ID }}
          NOTIFY_MAX_LENGTH: ${{ secrets.NOTIFY_MAX_LENGTH }}
          # 图片验证码识别（可选，遇到图片验证码时需要）
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          # 可选：代理配置（GitHub Actions 服务器通常可直连 TG，一般无需配置）
          PROXY_TYPE: ${{ secrets.PROXY_TYPE }}
          PROXY_HOST: ${{ secrets.PROXY_HOST }}
          PROXY_PORT: ${{ secrets.PROXY_PORT }}
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
          # 可选：邮件通知
          EMAIL_ENABLED: ${{ secrets.EMAIL_ENABLED }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SSL: ${{ secrets.SMTP_SSL }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python checkin.py

      # ====== 周报任务 ======
      - name: Run weekly report
        if: steps.set-report-type.outputs.report-type == 'weekly'
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          NOTIFY_CHAT_ID: ${{ secrets.NOTIFY_CHAT_ID }}
          NOTIFY_MAX_LENGTH: ${{ secrets.NOTIFY_MAX_LENGTH }}
          # 代理配置
          PROXY_TYPE: ${{ secrets.PROXY_TYPE }}
          PROXY_HOST: ${{ secrets.PROXY_HOST }}
          PROXY_PORT: ${{ secrets.PROXY_PORT }}
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
          # 邮件通知（周报通过邮件发送）
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SSL: ${{ secrets.SMTP_SSL }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          # 可选：通过 Telegram 发送报告
          REPORT_TELEGRAM: ${{ secrets.REPORT_TELEGRAM }}
        run: python report.py weekly

      # ====== 月报任务 ======
      - name: Run monthly report
        if: steps.set-report-type.outputs.report-type == 'monthly'
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          NOTIFY_CHAT_ID: ${{ secrets.NOTIFY_CHAT_ID }}
          NOTIFY_MAX_LENGTH: ${{ secrets.NOTIFY_MAX_LENGTH }}
          # 代理配置
          PROXY_TYPE: ${{ secrets.PROXY_TYPE }}
          PROXY_HOST: ${{ secrets.PROXY_HOST }}
          PROXY_PORT: ${{ secrets.PROXY_PORT }}
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
          # 邮件通知（月报通过邮件发送）
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SSL: ${{ secrets.SMTP_SSL }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          # 可选：通过 Telegram 发送报告
          REPORT_TELEGRAM: ${{ secrets.REPORT_TELEGRAM }}
        run: python report.py monthly

      # 历史记录保存由 Restore 步骤的 Post 阶段自动处理
      # （actions/cache@v4 在 key 未被精确命中时会自动保存）
      # 仅在 daily 签到任务时需要保存（签到会更新 history 文件）
      # 报告任务不需要保存，因为不会修改 history 文件

      # 无论成功失败都上传日志，方便排查
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkin-log
          path: checkin.log
          retention-days: 7
